name: Validate guide content
on:
  push:
    paths: ['index.html', '*.json', 'places-validator.js', 'tools/**', 'package*.json', '.github/workflows/validate-guide.yml']
  pull_request:
    paths: ['index.html', '*.json', 'places-validator.js', 'tools/**', 'package*.json', '.github/workflows/validate-guide.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: git diff --exit-code -- places-validator.js
