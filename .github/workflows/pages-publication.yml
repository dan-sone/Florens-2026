name: Verify Pages publication
on:
  push:
    branches: [main]
    paths: ['index.html', 'places.json', 'place-sheet.css', 'ui-theme.css', 'package.json', '.github/workflows/pages-publication.yml']
  pull_request:
    paths: ['.github/workflows/pages-publication.yml']
permissions:
  contents: read
  pages: read
  actions: read
concurrency:
  group: pages-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read Pages publication source and latest build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/pages" --jq '{html_url,build_type,source,status}'
          gh api "repos/$GH_REPO/pages/builds/latest" --jq '{status,commit,error}'
          gh api "repos/$GH_REPO/actions/runs?branch=main&per_page=10" --jq '[.workflow_runs[] | {id,name,status,conclusion,head_sha}]'
      - name: Inspect the currently published guide
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          site_url=$(gh api "repos/$GH_REPO/pages" --jq .html_url)
          curl --fail --silent --show-error --location --max-time 30 "${site_url}?verify=${GITHUB_SHA}" --output /tmp/published-guide.html
          node -e 'const html=require("fs").readFileSync("/tmp/published-guide.html","utf8");console.log(JSON.stringify({version:html.match(/name="application-version" content="([^"]+)"/)?.[1],sharedPlaceInfo:html.includes("function placeInfo(place)"),areaFollowing:html.includes("function focusDiscoveryArea(id)")}));'
      - name: Wait for the published release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          site_url=$(gh api "repos/$GH_REPO/pages" --jq .html_url)
          expected_version=$(node -p 'require("./package.json").version')
          for attempt in $(seq 1 50); do
            if curl --fail --silent --show-error --location --max-time 30 "${site_url}?release=${GITHUB_SHA}&attempt=${attempt}" --output /tmp/published-guide.html; then
              if EXPECTED_VERSION="$expected_version" node -e 'const fs=require("fs"),expected=process.env.EXPECTED_VERSION,html=fs.readFileSync("/tmp/published-guide.html","utf8"),version=html.match(/name="application-version" content="([^"]+)"/)?.[1];console.log(JSON.stringify({expected,version}));if(version!==expected||!html.includes("function placeInfo(place)")||!html.includes("function focusDiscoveryArea(id)"))process.exit(1);'; then
                if cmp --silent index.html /tmp/published-guide.html && curl --fail --silent --show-error --location --max-time 30 "${site_url}places.json?release=${GITHUB_SHA}&attempt=${attempt}" --output /tmp/published-places.json && cmp --silent places.json /tmp/published-places.json; then
                  echo "Verified published version $expected_version and matching guide/content files at $site_url"
                  exit 0
                fi
              fi
            fi
            sleep 20
          done
          echo 'The expected release did not reach GitHub Pages within the verification window.' >&2
          gh api "repos/$GH_REPO/pages/builds/latest" --jq '{status,commit,error}'
          exit 1
