name: Verify Pages publication
on:
  pull_request:
    paths: ['.github/workflows/pages-publication.yml']
permissions:
  contents: read
  pages: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read Pages publication source and latest build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/pages" --jq '{html_url,build_type,source,status}'
          gh api "repos/$GH_REPO/pages/builds/latest" --jq '{status,commit,error}'
