<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Florens – test av offlineområde</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css">
<style>html,body,#map{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}#map{position:absolute;inset:0}.panel{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;max-width:370px;z-index:1000;background:rgba(255,255,255,.95);color:#17212b;border-radius:14px;padding:12px 14px;box-shadow:0 3px 18px #0003;font-size:13px}.panel strong{font-size:15px}.panel p{margin:7px 0;line-height:1.4}.panel label{display:flex;align-items:center;gap:8px}.panel button{margin-top:7px;border:1px solid #aaa;border-radius:8px;padding:7px 10px;background:#fff}.legend{color:#256d83}.leaflet-container{background:#e9ecec}</style></head>
<body><div id="map"></div><section class="panel"><strong>Test: automatiskt offlineområde</strong><p id="status">Läser guidens platser och rutter …</p><label><input type="checkbox" id="show" checked> Visa planerat offlineområde</label><p class="legend">Streckad blå linje = planerat område, <b>inte nedladdat</b>.</p><button id="fit">Visa hela området</button><p id="offline-status">Kontrollerar offlineberedskap …</p><p id="estimate">Beräknar kartmängd …</p><p>Detta är en separat prototyp. Kartan kräver internet; ingen offlinekarta laddas ned.</p></section>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script><script src="offline-scope.js"></script><script>
(async()=>{const m=L.map('map',{zoomControl:true}).setView([43.77,11.255],13);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(m);
try{const files=['places.json','routes.json','offline-config.json'];const data=await Promise.all(files.map(async name=>{const response=await fetch(name,{cache:'no-store'});if(!response.ok)throw Error(name);return response.json()}));const scope=OfflineScope.compute(data[0].places,data[1].routes,data[2]);if(!scope.bounds)throw Error('Inga platser');const padded=L.latLngBounds(scope.bounds);const placeById=new Map(data[0].places.map(p=>[p.id,p]));const routeLayer=L.layerGroup();for(const route of data[1].routes){for(const segment of route.segments){const coords=(segment.placeIds||[]).map(id=>placeById.get(id)?.position).filter(Boolean).map(p=>[p.latitude,p.longitude]);if(coords.length>1)L.polyline(coords,{color:'#39788b',weight:2,opacity:.7,dashArray:segment.mode==='walk'?null:'4 6'}).addTo(routeLayer)}}routeLayer.addTo(m);const offlineBackground=L.rectangle([[-85,-180],[85,180]],{stroke:false,fillColor:'#e5e9e5',fillOpacity:1,interactive:false});const onlineTileLayers=[];m.eachLayer(layer=>{if(layer instanceof L.TileLayer)onlineTileLayers.push(layer)});const syncConnectivity=()=>{if(!navigator.onLine){onlineTileLayers.forEach(layer=>m.removeLayer(layer));offlineBackground.addTo(m);offlineBackground.bringToBack()}else{m.removeLayer(offlineBackground);onlineTileLayers.forEach(layer=>{if(!m.hasLayer(layer))layer.addTo(m)})}document.getElementById('offline-status').textContent=navigator.onLine?'Online: kartbakgrund visas. Platsdata och rutter kan lagras för offlinebruk.':'Offline: platsmarkörer och rutter visas på förenklad bakgrund; gatukarta saknas.'};window.addEventListener('online',syncConnectivity);window.addEventListener('offline',syncConnectivity);syncConnectivity();const polygon=L.rectangle(padded,{color:'#267b96',weight:2,dashArray:'7 6',fillColor:'#267b96',fillOpacity:.055,interactive:false}).addTo(m);L.layerGroup(scope.included.map(p=>L.circleMarker([p.position.latitude,p.position.longitude],{radius:4,color:'#a64c35',weight:1,fillOpacity:.8}).bindPopup(p.name))).addTo(m);m.fitBounds(padded,{padding:[25,25]});document.getElementById('status').textContent=scope.included.length+' platser ingår, '+scope.excluded.length+' utesluts. Marginal '+data[2].marginMeters+' meter.';const tileCount=(bounds,minZ,maxZ)=>{const latY=(lat,z)=>{const a=lat*Math.PI/180;return Math.floor((1-Math.asinh(Math.tan(a))/Math.PI)/2*Math.pow(2,z))};const lonX=(lon,z)=>Math.floor((lon+180)/360*Math.pow(2,z));let total=0;for(let z=minZ;z<=maxZ;z++){const x1=lonX(bounds[0][1],z),x2=lonX(bounds[1][1],z),y1=latY(bounds[1][0],z),y2=latY(bounds[0][0],z);total+=(x2-x1+1)*(y2-y1+1)}return total};const n=tileCount(scope.bounds,12,16);document.getElementById('estimate').textContent='Kartbehov zoom 12–16: cirka '+n.toLocaleString('sv-SE')+' kartplattor. Endast uppskattning – ingen nedladdning görs.';document.getElementById('show').addEventListener('change',e=>{if(e.target.checked)polygon.addTo(m);else m.removeLayer(polygon)});document.getElementById('fit').addEventListener('click',()=>m.fitBounds(padded,{padding:[25,25]}));}catch(e){document.getElementById('status').textContent='Kunde inte läsa guidens data: '+e.message;console.error(e)}})();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./offline-test-sw.js',{scope:'./offline-map-test.html'}).then(()=>{document.getElementById('offline-status').textContent='Offlinecache aktiverad. Ladda om sidan en gång online innan flygplansläge.'}).catch(e=>{document.getElementById('offline-status').textContent='Offlinecache kunde inte aktiveras: '+e.message})}else document.getElementById('offline-status').textContent='Webbläsaren saknar stöd för offlinecache.';
</script></body></html>
