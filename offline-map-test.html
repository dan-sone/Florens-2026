<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Florens – test av offlineområde</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css">
<style>html,body,#map{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}#map{position:absolute;inset:0}.panel{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;max-width:370px;z-index:1000;background:rgba(255,255,255,.95);color:#17212b;border-radius:14px;padding:12px 14px;box-shadow:0 3px 18px #0003;font-size:13px}.panel strong{font-size:15px}.panel p{margin:7px 0;line-height:1.4}.panel label{display:flex;align-items:center;gap:8px}.panel button{margin-top:7px;border:1px solid #aaa;border-radius:8px;padding:7px 10px;background:#fff}.legend{color:#256d83}.leaflet-container{background:#e9ecec}</style></head>
<body><div id="map"></div><section class="panel"><strong>Test: automatiskt offlineområde</strong><p id="status">Läser guidens platser och rutter …</p><label><input type="checkbox" id="show" checked> Visa planerat offlineområde</label><p class="legend">Streckad blå linje = planerat område, <b>inte nedladdat</b>.</p><button id="fit">Visa hela området</button><p>Detta är en separat prototyp. Kartan kräver internet; ingen offlinekarta laddas ned.</p></section>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script><script>
(async()=>{const m=L.map('map',{zoomControl:true}).setView([43.77,11.255],13);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(m);
try{const [places,routes]=await Promise.all(['places.json','routes.json'].map(async x=>{const r=await fetch(x,{cache:'no-store'});if(!r.ok)throw Error(x+' '+r.status);return r.json()}));const byId=new Map(places.places.map(p=>[p.id,p]));const routeIds=new Set(routes.routes.flatMap(r=>r.segments.flatMap(s=>s.placeIds)));const points=places.places.filter(p=>Number.isFinite(p.position?.latitude)&&Number.isFinite(p.position?.longitude));const routePoints=[...routeIds].map(id=>byId.get(id)).filter(p=>p?.position);const all=points.concat(routePoints);const bounds=L.latLngBounds(all.map(p=>[p.position.latitude,p.position.longitude]));const latPad=.0035,lonPad=.005;const sw=bounds.getSouthWest(),ne=bounds.getNorthEast();const padded=L.latLngBounds([sw.lat-latPad,sw.lng-lonPad],[ne.lat+latPad,ne.lng+lonPad]);const polygon=L.rectangle(padded,{color:'#267b96',weight:2,dashArray:'7 6',fillColor:'#267b96',fillOpacity:.055,interactive:false}).addTo(m);const markers=L.layerGroup(points.map(p=>L.circleMarker([p.position.latitude,p.position.longitude],{radius:4,color:'#a64c35',weight:1,fillOpacity:.8}).bindPopup(p.name))).addTo(m);m.fitBounds(padded,{padding:[25,25]});document.getElementById('status').textContent=points.length+' sevärdheter och '+routeIds.size+' ruttstopp ingår. Marginal: cirka 350 m norr/söder och 400 m öster/väster. Området räknas om från aktuella data vid varje laddning.';document.getElementById('show').addEventListener('change',e=>{if(e.target.checked)polygon.addTo(m);else m.removeLayer(polygon)});document.getElementById('fit').addEventListener('click',()=>m.fitBounds(padded,{padding:[25,25]}));}catch(e){document.getElementById('status').textContent='Kunde inte läsa guidens data: '+e.message;console.error(e)}})();
</script></body></html>
