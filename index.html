 async function readJson(path){
  const response=await fetch(path+'?v='+encodeURIComponent(version),{cache:'no-store'});
  if(!response.ok) throw new Error('Kunde inte läsa '+path+' ('+response.status+')');
  return response.json();
 }
 const names=['places','routes','guide'];
 const entries=await Promise.all(names.map(async name=>{const data=await readJson(name+'.json');const path='./'+name+'.schema.v'+data.schemaVersion+'.json';if(data.$schema!==path)throw new Error('Fel schemareferens: '+name);const schema=await readJson(path.slice(2));return [name,schema,data];}));
 const schemas=Object.fromEntries(entries.map(([name,schema])=>[name,schema]));
 const documents=Object.fromEntries(entries.map(([name,,data])=>[name,data]));
 PlacesValidator.validateTrip(schemas,documents);
 const {places:content,routes:routeContent,guide}=documents;
 document.title=guide.title;

 const placesById=new Map(content.places.map(p=>[p.id,p]));

 function requirePlace(id){const p=placesById.get(id);if(!p)throw new Error('Okänd plats i guiden: '+id);return p;}
 function coordinates(place){if(!place.position)throw new Error('Platsen saknar position: '+place.id);return [place.position.latitude,place.position.longitude];}

 function mapLink(place){return PlacesValidator.applePlaceLink(place);}
 function renderPopup(place,presentation){
  // Import notes are retained in content, but are not part of the visitor-facing popup.
  const description=presentation.descriptionSeparator ? place.description.split(presentation.descriptionSeparator)[0] : place.description;
  const text=description.split('\n').map(line=>line.startsWith('Markören')?'<small>'+esc(line)+'</small>':esc(line)).join('<br>');
  const uncertainty=place.verification.status==='unresolved'?'<small>'+esc(place.verification.checks.placeLink?'Plats/entré behöver bekräftas.':'Namngiven kartpunkt; företagskort ej verifierat.')+'</small><br>':'';
  const website=place.website?'<a target="_blank" rel="noopener" href="'+esc(place.website)+'">Webbplats ↗</a><br>':'';

function eIcon(symbol,color){
  var markerColor = color==='#d33b32'?'red':color==='#315f9b'?'blue':color==='#d9822b'?'orange':color==='#555b66'?'darkblue':(color==='#7b5aa6'||color==='#7b4aa3')?'purple':'blue';
  var icon='info-sign', prefix='glyphicon';
  if(symbol.indexOf('✂')>=0){icon='scissors'; prefix='fa';}
  else if(symbol.indexOf('🏠')>=0){icon='home';}
  else if(symbol.indexOf('🍦')>=0){icon='ice-cream'; prefix='fa';}
  else if(symbol.indexOf('🍸')>=0){icon='glass';}
  else if(symbol.indexOf('📷')>=0){icon='camera';}
  else if(symbol.indexOf('🛍')>=0){icon='shopping-cart';}
  else if(symbol.indexOf('🍴')>=0){icon='cutlery'; prefix='fa';}
  else if(symbol.indexOf('🏛')>=0){icon='tower';}
  return L.AwesomeMarkers.icon({markerColor:markerColor,iconColor:'white',icon:icon,prefix:prefix});
}

 button.title='Uppdatera guiden';
 button.setAttribute('aria-label','Uppdatera guiden');
 button.textContent='↻';
 button.style.cssText='display:block;width:34px;height:34px;padding:0;border:0;background:#fff;color:#222;font-size:25px;line-height:34px;cursor:pointer;border-radius:2px';
 L.DomEvent.disableClickPropagation(box);
 L.DomEvent.disableScrollPropagation(box);
 button.addEventListener('click',function(){
  button.disabled=true;
  const url=new URL(window.location.href);
  url.searchParams.set('v',Date.now().toString());
  window.location.replace(url.href);
 });
 return box;
};
refreshControl.addTo(m);

function renderProgram(program){
 return program.map(paragraph=>'<p>'+paragraph.nodes.map(node=>{
  const text=esc(node.text);
  if(node.type==='strong')return '<b>'+text+'</b>';
  if(node.type==='emphasis')return '<i>'+text+'</i>';
  if(node.type==='place')return '<button data-place="'+esc(node.placeId)+'">'+text+'</button>';
  return text;
 }).join('')+'</p>').join('');
}
const selections=[guide.defaultSelection,...guide.days];
const schedule=Object.fromEntries(selections.map(day=>[day.id,renderProgram(day.program)]));
const select=document.getElementById('routeSelect');
select.replaceChildren(...selections.map(day=>{const option=document.createElement('option');option.value=day.id;option.textContent=day.label;return option;}));
function chooseDay(day){
 renderRouteLinks(day);
 document.getElementById('routeSelect').value=day;
 document.getElementById('daycard').innerHTML=schedule[day];
}
document.getElementById('routeSelect').addEventListener('change',e=>chooseDay(e.target.value));
document.getElementById('daycard').addEventListener('click',e=>{
 const button=e.target.closest('[data-place]');if(!button)return;
 const id=button.dataset.place;const marker=markersById.get(id);
 if(marker && m.hasLayer(marker)){m.setView(marker.getLatLng(),16);marker.openPopup();}
 else window.open(mapLink(requirePlace(id)),'_blank');
});
m.on('popupopen',function(evt){
 const popup=evt.popup, el=popup.getElement();if(!el)return;
 const content=el.querySelector('.leaflet-popup-content');if(!content||content.querySelector('.navactions'))return;
 const marker=evt.popup._source;const ll=marker&&marker.getLatLng?marker.getLatLng():null;if(!ll)return;
 const place=requirePlace(marker.placeId);
 const name=place.name;
 const row=document.createElement('div');row.className='navactions';
 const modes=[['Gå','walking'],['Kollektivtrafik','transit'],['Bil/taxi','driving']];
 modes.forEach(([label,mode])=>{const a=document.createElement('a');a.textContent=label;a.target='_blank';a.rel='noopener';a.href=PlacesValidator.appleDirectionsLink(place,mode);row.appendChild(a)});
 const ai=document.createElement('button');ai.textContent='Fråga ChatGPT';ai.title='Kopierar platsfrågan och öppnar ChatGPT';ai.onclick=async()=>{
 const question='Berätta om '+name+' i '+guide.destination.name+': historia, kultur och vad som är särskilt intressant att uppmärksamma vid ett besök. Vi är särskilt intresserade av hantverk, konst och lokala traditioner.';
 try{await navigator.clipboard.writeText(question);alert('Frågan kopierad. Klistra in den i ChatGPT.')}catch(e){prompt('Kopiera frågan:',question)}
 window.open('https://chatgpt.com/','_blank','noopener');
 };row.appendChild(ai);const body=document.createElement('div');while(content.firstChild)body.appendChild(content.firstChild);body.appendChild(row);popup.setContent(body);
});
// Automatic day selection uses the trip's own timezone and dates.
const parts=new Intl.DateTimeFormat('en-CA',{timeZone:guide.timeZone,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
const value=type=>parts.find(p=>p.type===type).value;
const date=value('year')+'-'+value('month')+'-'+value('day');
const selected=guide.days.find(day=>day.date===date)?.id || guide.defaultSelection.id;
chooseDay(selected);


// Version 1.2.0: the three views share the same validated trip documents.
let currentView='karta';
const listView=document.getElementById('listView');
function setView(view){
 if(!['karta','schema','sevardheter'].includes(view))view='karta';
 currentView=view;document.body.dataset.view=view;listView.hidden=view==='karta';
 document.getElementById('schemaPanel').hidden=view!=='schema';document.getElementById('placesPanel').hidden=view!=='sevardheter';
 document.querySelectorAll('#viewTabs [data-view]').forEach(button=>{const active=button.dataset.view===view;button.setAttribute('aria-selected',String(active));button.tabIndex=active?0:-1});
 if(view==='sevardheter')renderPlaceList();if(view==='karta')requestAnimationFrame(()=>m.invalidateSize());
 const url=new URL(location.href);url.hash=view==='karta'?'':view;history.replaceState(null,'',url);
}
function showPlaceOnMap(id){
 const marker=markersById.get(id);if(!marker){const place=requirePlace(id);if(place.position)window.open(mapLink(place),'_blank','noopener');else if(place.website)window.open(place.website,'_blank','noopener');return;}
 const group=guide.persistentPlaceIds.includes(id)?m:bookedIds.includes(id)?bookedGroup:groups[requirePlace(id).category];
 if(group!==m&&!m.hasLayer(group))group.addTo(m);
 setView('karta');requestAnimationFrame(()=>{m.setView(marker.getLatLng(),16,{animate:false});marker.openPopup()});
}
function listActions(place){
 if(!place.position)return '<p class="address">Kartposition saknas ännu.</p>';
 return '<div class="list-actions"><button class="list-action" data-show-place="'+esc(place.id)+'">Visa på kartan</button>'+[['Gå','walking'],['Kollektivtrafik','transit'],['Bil/taxi','driving']].map(([label,mode])=>'<a class="list-action" target="_blank" rel="noopener" href="'+esc(PlacesValidator.appleDirectionsLink(place,mode))+'">'+label+'</a>').join('')+'<a class="list-action" target="_blank" rel="noopener" href="'+esc(mapLink(place))+'">Apple Kartor ↗</a></div>';
}
const dateFormatter=new Intl.DateTimeFormat('sv-SE',{timeZone:'UTC',weekday:'long',day:'numeric',month:'long'});
const bookingDateFormatter=new Intl.DateTimeFormat('en-CA',{timeZone:guide.timeZone,year:'numeric',month:'2-digit',day:'2-digit'});
const timeFormatter=new Intl.DateTimeFormat('sv-SE',{timeZone:guide.timeZone,hour:'2-digit',minute:'2-digit'});
const localBookingDate=b=>{const parts=bookingDateFormatter.formatToParts(new Date(b.startsAt));const get=type=>parts.find(p=>p.type===type).value;return get('year')+'-'+get('month')+'-'+get('day')};
function renderFlightCards(day){
 const flights=(guide.flights||[]).filter(f=>f.dayId===day.id).sort((a,b)=>new Date(a.departure.at)-new Date(b.departure.at));
 if(!flights.length)return '';
 const clock=e=>new Intl.DateTimeFormat('sv-SE',{timeZone:e.timeZone,hour:'2-digit',minute:'2-digit'}).format(new Date(e.at));
 const arrivalDate=e=>new Intl.DateTimeFormat('sv-SE',{timeZone:e.timeZone,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(e.at));
 return '<h3>Flyg</h3>'+flights.map((f,i)=>{
  const next=flights[i+1];
  const minutes=next&&f.arrival.airportCode===next.departure.airportCode?Math.round((new Date(next.departure.at)-new Date(f.arrival.at))/60000):null;
  const connection=minutes!==null&&minutes>=0?'<p class="address">Byte i '+esc(f.arrival.city)+' · '+minutes+' min</p>':'';
  const dateNote=arrivalDate(f.arrival)!==day.date?' · '+dateFormatter.format(new Date(arrivalDate(f.arrival)+'T12:00:00Z')):'';
  return '<article class="list-card" data-flight="'+esc(f.id)+'"><h4>'+esc(clock(f.departure))+'–'+esc(clock(f.arrival))+' · '+esc(f.departure.airportCode)+' → '+esc(f.arrival.airportCode)+esc(dateNote)+'</h4><p class="address">'+esc(f.flightNumber)+' · '+esc(f.operator)+(f.departure.terminal?' · Terminal '+esc(f.departure.terminal):'')+'</p>'+connection+'</article>';
 }).join('');
}
function renderScheduleList(){
 const sections=guide.days.map(day=>{
  const bookings=guide.bookings.filter(b=>localBookingDate(b)===day.date).sort((a,b)=>new Date(a.startsAt)-new Date(b.startsAt));
  const bookedPlaces=new Set(bookings.map(b=>b.placeId));
  const stops=[...new Set(day.routeIds.flatMap(id=>routesById.get(id).segments.flatMap(s=>s.placeIds)))].filter(id=>!bookedPlaces.has(id)&&!guide.persistentPlaceIds.includes(id));
  const title=dateFormatter.format(new Date(day.date+'T12:00:00Z'));
  const flightsAfterProgram=day.id===guide.days[guide.days.length-1].id;
  return '<section class="day-section" data-day="'+esc(day.id)+'"><h2>'+esc(title[0].toUpperCase()+title.slice(1))+'</h2>'+(flightsAfterProgram?'':renderFlightCards(day))+(bookings.length?'<h3>Bokningar</h3>'+bookings.map(b=>{const place=requirePlace(b.placeId);return '<article class="list-card" data-booking="'+esc(b.id)+'"><span class="list-badge">Bokat</span><h4>'+esc(timeFormatter.format(new Date(b.startsAt)))+' · '+esc(place.name)+'</h4>'+listActions(place)+'</article>'}).join(''):'')+'<h3>Planerat program</h3><article class="list-card list-program">'+renderProgram(day.program)+'</article>'+(stops.length?'<h3>Valbara stopp längs rutten</h3><div class="optional-stops">'+stops.map(id=>'<button class="list-action" data-show-place="'+esc(id)+'">'+esc(requirePlace(id).name)+'</button>').join('')+'</div>':'')+(flightsAfterProgram?renderFlightCards(day):'')+'</section>';
 }).join('');
 document.getElementById('schemaPanel').innerHTML='<h1>Schema</h1><p class="list-intro">Flyg, bokningar, dagens plan och valbara stopp. '+esc(guide.destination.name)+'.</p>'+sections;
}
const filterBox=document.getElementById('placeFilters');
filterBox.innerHTML=guide.categories.map(c=>'<button aria-pressed="true" data-category="'+esc(c.id)+'">'+esc(c.label)+'</button>').join('');
function placeVisible(place){return guide.persistentPlaceIds.includes(place.id)||m.hasLayer(groups[bookedIds.includes(place.id)?'booked':place.category])}
function renderPlaceList(){
 filterBox.querySelectorAll('[data-category]').forEach(button=>button.setAttribute('aria-pressed',String(m.hasLayer(groups[button.dataset.category]))));
 const visible=content.places.filter(placeVisible).sort((a,b)=>a.name.localeCompare(b.name,'sv'));
 document.getElementById('placeCount').textContent=visible.length+' av '+content.places.length+' platser';
 document.getElementById('placeList').innerHTML=visible.length?visible.map(place=>{
  const presentation=markerPresentation[place.id]||{};
  const description=presentation.descriptionSeparator?place.description.split(presentation.descriptionSeparator)[0]:place.description;
  const category=guide.categories.find(c=>c.id===place.category)?.label||'Boende';
  const badge=bookedIds.includes(place.id)?'<span class="list-badge">Bokat</span>':'<span class="list-badge optional">'+esc(category)+'</span>';
  return '<article class="list-card" data-place-card="'+esc(place.id)+'">'+badge+'<h2>'+esc(place.name)+'</h2><p>'+esc(description.split('\n').filter(line=>!line.startsWith('Markören')).join('\n')).replace(/\n/g,'<br>')+'</p>'+(place.address?'<p class="address">'+esc(place.address)+'</p>':'')+(place.verification.status==='unresolved'?'<span class="list-badge uncertain">Uppgifter behöver bekräftas</span>':'')+listActions(place)+'</article>';
 }).join(''):'<p class="list-empty">Inga platser i de valda kategorierna.</p>';
}
filterBox.addEventListener('click',event=>{const button=event.target.closest('[data-category]');if(!button)return;const group=groups[button.dataset.category];if(m.hasLayer(group))m.removeLayer(group);else group.addTo(m);renderPlaceList()});
m.on('overlayadd overlayremove',()=>{if(currentView==='sevardheter')renderPlaceList()});
listView.addEventListener('click',event=>{const button=event.target.closest('[data-show-place],[data-place]');if(button)showPlaceOnMap(button.dataset.showPlace||button.dataset.place)});
document.getElementById('viewTabs').addEventListener('click',event=>{const button=event.target.closest('[data-view]');if(button)setView(button.dataset.view)});
document.getElementById('viewTabs').addEventListener('keydown',event=>{const tabs=[...document.querySelectorAll('#viewTabs [data-view]')];const index=tabs.indexOf(document.activeElement);if(index<0||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;setView(tabs[next].dataset.view);tabs[next].focus()});
renderScheduleList();setView(location.hash.slice(1));
window.addEventListener('hashchange',()=>setView(location.hash.slice(1)));

 return {map:m,content,guide,routeContent,placesById,markersById,dayRoutes,chooseDay,setView,showPlaceOnMap};
})();
guideReady.catch(error=>{
 console.error(error);
 const card=document.getElementById('daycard');
 card.textContent='Guiden kunde inte laddas. Tryck på uppdatera eller ladda om sidan.';
 card.style.display='block';
});
</script></html>
