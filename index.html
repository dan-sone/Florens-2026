<script src="places-validator.js"></script>
<script>
// UI presentation belongs here; names, coordinates, descriptions and addresses belong in places.json.

const guideReady = (async function(){
 const version=new URL(window.location.href).searchParams.get('v') || Date.now().toString();
 async function readJson(path){
  const response=await fetch(path+'?v='+encodeURIComponent(version),{cache:'no-store'});
  if(!response.ok) throw new Error('Kunde inte läsa '+path+' ('+response.status+')');
  return response.json();
 }
 const names=['places','routes','guide'];
 const entries=await Promise.all(names.map(async name=>{const [schema,data]=await Promise.all([readJson(name+'.schema.v1.json'),readJson(name+'.json')]);return [name,schema,data];}));
 const schemas=Object.fromEntries(entries.map(([name,schema])=>[name,schema]));
 const documents=Object.fromEntries(entries.map(([name,,data])=>[name,data]));
 PlacesValidator.validateTrip(schemas,documents);
 const {places:content,routes:routeContent,guide}=documents;
 document.title=guide.title;
 const markerPresentation=guide.presentation.placeOverrides;
 const bookedIds=guide.bookings.map(b=>b.placeId);
 const placesById=new Map(content.places.map(p=>[p.id,p]));
 const routesById=new Map(routeContent.routes.map(r=>[r.id,r]));
 function requirePlace(id){const p=placesById.get(id);if(!p)throw new Error('Okänd plats i guiden: '+id);return p;}
 function coordinates(place){if(!place.position)throw new Error('Platsen saknar position: '+place.id);return [place.position.latitude,place.position.longitude];}
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function mapLink(place){
  // Pending imports keep the existing Apple Maps search behavior.
  // Only verified place identity may replace it with a direct place link.
  if(place.verification.status==='verified'){
   if(place.appleMaps.placeUrl)return place.appleMaps.placeUrl;
   if(place.appleMaps.placeId)return 'https://maps.apple.com/?place-id='+encodeURIComponent(place.appleMaps.placeId);
  }
  return 'https://maps.apple.com/?q='+encodeURIComponent(place.name+' '+(place.address||guide.destination.searchSuffix));
 }
 function renderPopup(place,presentation){
  // Import notes are retained in content, but are not part of the visitor-facing popup.
  const description=presentation.descriptionSeparator ? place.description.split(presentation.descriptionSeparator)[0] : place.description;
  const text=description.split('\n').map(line=>line.startsWith('Markören')?'<small>'+esc(line)+'</small>':esc(line)).join('<br>');
  const website=place.website?'<a target="_blank" rel="noopener" href="'+esc(place.website)+'">Restaurangens webbplats ↗</a><br>':'';
  return '<div style="'+esc(presentation.style||'')+'"><b>'+esc(place.name)+'</b><br>'+text+'<br><br>'+website+'<a target="_blank" rel="noopener" href="'+esc(mapLink(place))+'">'+esc(presentation.mapLabel||'Öppna i Apple Kartor ↗')+'</a></div>';
 }
var map_1391adca8bfb43099964d4b8f21913ee = L.map(
                "map_1391adca8bfb43099964d4b8f21913ee",
                {
                    center: [guide.map.center.latitude, guide.map.center.longitude],
                    crs: L.CRS.EPSG3857,
                    ...{
  "zoom": guide.map.zoom,
  "zoomControl": true,
  "preferCanvas": false,
}

                }
            );

  "subdomains": "abc",

}

            (function(){
  var st=document.createElement('style');
  st.textContent='.awesome-marker{filter:none!important}.awesome-marker i{font-size:14px!important;margin-top:8px!important}';
  document.head.appendChild(st);
})();
function eIcon(symbol,color){
  var markerColor = color==='#d33b32'?'red':color==='#315f9b'?'blue':color==='#d9822b'?'orange':color==='#555b66'?'darkblue':(color==='#7b5aa6'||color==='#7b4aa3')?'purple':'blue';
  var icon='info-sign', prefix='glyphicon';
  if(symbol.indexOf('✂')>=0){icon='scissors'; prefix='fa';}
  else if(symbol.indexOf('🏠')>=0){icon='home';}
  else if(symbol.indexOf('🍦')>=0){icon='ice-cream'; prefix='fa';}
  else if(symbol.indexOf('🍸')>=0){icon='glass';}
  else if(symbol.indexOf('📷')>=0){icon='camera';}
  else if(symbol.indexOf('🛍')>=0){icon='shopping-cart';}
  else if(symbol.indexOf('🍴')>=0){icon='cutlery'; prefix='fa';}
  else if(symbol.indexOf('🏛')>=0){icon='tower';}
  return L.AwesomeMarkers.icon({markerColor:markerColor,iconColor:'white',icon:icon,prefix:prefix});
}
function shoppingIcon(){return L.divIcon({className:'shopping-pin-wrap',html:'<div class="shopping-pin"><div class="pin"><i class="fa fa-shopping-bag"></i></div></div>',iconSize:[28,38],iconAnchor:[14,36],popupAnchor:[0,-34]});}

 var m=map_1391adca8bfb43099964d4b8f21913ee;
 var bookedGroup=L.layerGroup(),seeDoGroup=L.layerGroup(),craftGroup=L.layerGroup(),foodGroup=L.layerGroup(),shoppingGroup=L.layerGroup();
 const groups={'booked':bookedGroup,'see-do':seeDoGroup,'craft':craftGroup,'food-drink':foodGroup,'shopping':shoppingGroup,'hotel':L.layerGroup()};
 const markersById=new Map();
 content.places.forEach(place=>{
  if(!place.position)return; // A pending record without coordinates cannot be drawn.
  const presentation=markerPresentation[place.id]||{style:'min-width:210px'};
  const config=presentation.icon;
  const icon=config?(config.className?L.divIcon(config):L.AwesomeMarkers.icon(config)):
   place.category==='shopping'?shoppingIcon():eIcon(place.category==='hotel'?'🏠':place.category==='craft'?'✂️':place.category==='food-drink'?'🍴':'🏛️',place.category==='hotel'?'#d33b32':place.category==='craft'?'#7b4aa3':place.category==='food-drink'?'#d9822b':'#315f9b');
  const marker=L.marker(coordinates(place),{icon}).bindPopup(renderPopup(place,presentation));
  marker.placeId=place.id;
  if(presentation.tooltip)marker.bindTooltip(place.name);
  markersById.set(place.id,marker);
  const group=guide.persistentPlaceIds.includes(place.id)?m:bookedIds.includes(place.id)?bookedGroup:groups[place.category];
  marker.addTo(group);
 });
 L.control.fullscreen({position:'topleft',title:'Full Screen',titleCancel:'Exit Full Screen',forceSeparateButton:false}).addTo(m);
 L.control.locate({}).addTo(m);
 var layerControl=L.control.layers(null,Object.fromEntries(guide.categories.map(c=>[c.label,groups[c.id]])),{position:'topright',collapsed:true}).addTo(m);
 guide.categories.forEach(c=>groups[c.id].addTo(m));
const dayRoutes={};
function buildRoutes(){
 guide.days.forEach(day=>{
  const group=L.featureGroup();
  day.routeIds.forEach(id=>routesById.get(id).segments.forEach(segment=>{
   const pts=segment.placeIds.map(id=>coordinates(requirePlace(id)));
   const transport=segment.mode!=='walk';
   L.polyline(pts,{color:'#007AFF',weight:4,opacity:.78,dashArray:transport?'7 7':null,lineCap:'round',lineJoin:'round'}).addTo(group);
  }));
  if(day.routeIds.length)dayRoutes[day.id]=group;
 });
}
buildRoutes();
function renderRouteLinks(day){
 const box=document.getElementById('routeLegs'); if(box) box.innerHTML='';
 Object.values(dayRoutes).forEach(g=>{if(m.hasLayer(g))m.removeLayer(g)});
 if(dayRoutes[day]){dayRoutes[day].addTo(m);m.fitBounds(dayRoutes[day].getBounds().pad(.08),{maxZoom:15});}
}
// Liten uppdateringsknapp för webbappen: ny URL kringgår gammal HTML i cache.
var refreshControl=L.control({position:'topleft'});
refreshControl.onAdd=function(){
 const box=L.DomUtil.create('div','leaflet-bar');
 const button=L.DomUtil.create('button','',box);
 button.type='button';
 button.title='Uppdatera guiden';
 button.setAttribute('aria-label','Uppdatera guiden');
 button.textContent='↻';
 button.style.cssText='display:block;width:34px;height:34px;padding:0;border:0;background:#fff;color:#222;font-size:25px;line-height:34px;cursor:pointer;border-radius:2px';
 L.DomEvent.disableClickPropagation(box);
 L.DomEvent.disableScrollPropagation(box);
 button.addEventListener('click',function(){
  button.disabled=true;
  const url=new URL(window.location.href);
  url.searchParams.set('v',Date.now().toString());
  window.location.replace(url.href);
 });
 return box;
};
refreshControl.addTo(m);

function renderProgram(program){
 return program.map(paragraph=>'<p>'+paragraph.nodes.map(node=>{
  const text=esc(node.text);
  if(node.type==='strong')return '<b>'+text+'</b>';
  if(node.type==='emphasis')return '<i>'+text+'</i>';
  if(node.type==='place')return '<button data-place="'+esc(node.placeId)+'">'+text+'</button>';
  return text;
 }).join('')+'</p>').join('');
}
const selections=[guide.defaultSelection,...guide.days];
const schedule=Object.fromEntries(selections.map(day=>[day.id,renderProgram(day.program)]));
const select=document.getElementById('routeSelect');
select.replaceChildren(...selections.map(day=>{const option=document.createElement('option');option.value=day.id;option.textContent=day.label;return option;}));
function chooseDay(day){
 renderRouteLinks(day);
 document.getElementById('routeSelect').value=day;
 document.getElementById('daycard').innerHTML=schedule[day];
}
document.getElementById('routeSelect').addEventListener('change',e=>chooseDay(e.target.value));
document.getElementById('daycard').addEventListener('click',e=>{
 const button=e.target.closest('[data-place]');if(!button)return;
 const id=button.dataset.place;const marker=markersById.get(id);
 if(marker && m.hasLayer(marker)){m.setView(marker.getLatLng(),16);marker.openPopup();}
 else window.open(mapLink(requirePlace(id)),'_blank');
});
m.on('popupopen',function(evt){
 const popup=evt.popup, el=popup.getElement();if(!el)return;
 const content=el.querySelector('.leaflet-popup-content');if(!content||content.querySelector('.navactions'))return;
 const marker=evt.popup._source;const ll=marker&&marker.getLatLng?marker.getLatLng():null;if(!ll)return;
 const place=requirePlace(marker.placeId);
 const name=place.name;
 const dest=markerPresentation[place.id]?.directionsUsesAddress===false ? name+' '+guide.destination.searchSuffix : place.address || name+' '+guide.destination.searchSuffix;
 const row=document.createElement('div');row.className='navactions';
 const modes=[['Gå','w'],['Kollektivtrafik','r'],['Bil/taxi','d']];
 modes.forEach(([label,mode])=>{const a=document.createElement('a');a.textContent=label;a.target='_blank';a.rel='noopener';a.href='https://maps.apple.com/?daddr='+encodeURIComponent(dest)+'&dirflg='+mode;row.appendChild(a)});
 const ai=document.createElement('button');ai.textContent='Fråga ChatGPT';ai.title='Kopierar platsfrågan och öppnar ChatGPT';ai.onclick=async()=>{
 const question='Berätta om '+name+' i '+guide.destination.name+': historia, kultur och vad som är särskilt intressant att uppmärksamma vid ett besök. Vi är särskilt intresserade av hantverk, konst och lokala traditioner.';
 try{await navigator.clipboard.writeText(question);alert('Frågan kopierad. Klistra in den i ChatGPT.')}catch(e){prompt('Kopiera frågan:',question)}
 window.open('https://chatgpt.com/','_blank','noopener');
 };row.appendChild(ai);const body=document.createElement('div');while(content.firstChild)body.appendChild(content.firstChild);body.appendChild(row);popup.setContent(body);
});
// Automatic day selection uses the trip's own timezone and dates.
const parts=new Intl.DateTimeFormat('en-CA',{timeZone:guide.timeZone,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
const value=type=>parts.find(p=>p.type===type).value;
const date=value('year')+'-'+value('month')+'-'+value('day');
const selected=guide.days.find(day=>day.date===date)?.id || guide.defaultSelection.id;
chooseDay(selected);

 return {map:m,content,guide,routeContent,placesById,markersById,dayRoutes,chooseDay};
})();
guideReady.catch(error=>{
 console.error(error);
 const card=document.getElementById('daycard');
 card.textContent='Guiden kunde inte laddas. Tryck på uppdatera eller ladda om sidan.';
 card.style.display='block';
});
