const localBookingDate=b=>{const parts=bookingDateFormatter.formatToParts(new Date(b.startsAt));const get=type=>parts.find(p=>p.type===type).value;return get('year')+'-'+get('month')+'-'+get('day')};
function renderFlightCards(day){
 const flights=(guide.flights||[]).filter(f=>f.dayId===day.id).sort((a,b)=>new Date(a.departure.at)-new Date(b.departure.at));
 if(!flights.length)return '';
 const clock=e=>new Intl.DateTimeFormat('sv-SE',{timeZone:e.timeZone,hour:'2-digit',minute:'2-digit'}).format(new Date(e.at));
 const arrivalDate=e=>new Intl.DateTimeFormat('sv-SE',{timeZone:e.timeZone,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(e.at));
 return '<h3>Flyg</h3>'+flights.map((f,i)=>{
  const next=flights[i+1];
  const minutes=next&&f.arrival.airportCode===next.departure.airportCode?Math.round((new Date(next.departure.at)-new Date(f.arrival.at))/60000):null;
  const connection=minutes!==null&&minutes>=0?'<p class="address">Byte i '+esc(f.arrival.city)+' · '+minutes+' min</p>':'';
  const dateNote=arrivalDate(f.arrival)!==day.date?' · '+dateFormatter.format(new Date(arrivalDate(f.arrival)+'T12:00:00Z')):'';
  return '<article class="list-card" data-flight="'+esc(f.id)+'"><h4>'+esc(clock(f.departure))+'–'+esc(clock(f.arrival))+' · '+esc(f.departure.airportCode)+' → '+esc(f.arrival.airportCode)+esc(dateNote)+'</h4><p class="address">'+esc(f.flightNumber)+' · '+esc(f.operator)+(f.departure.terminal?' · Terminal '+esc(f.departure.terminal):'')+'</p>'+connection+'</article>';
 }).join('');
}
function renderScheduleList(){
 const stayCards=guide.persistentPlaceIds.map(id=>{const place=requirePlace(id);return '<article class="list-card" data-stay="'+esc(id)+'" data-category="'+esc(place.category)+'"><span class="list-badge">Boende</span><h4>'+placeIcon(place)+esc(place.name)+'</h4>'+placeDescription(place)+(place.address?'<p class="address">'+esc(place.address)+'</p>':'')+listActions(place)+'</article>'}).join('');
 const sections=guide.days.map(day=>{
  const bookings=guide.bookings.filter(b=>localBookingDate(b)===day.date).sort((a,b)=>new Date(a.startsAt)-new Date(b.startsAt));
  const bookedPlaces=new Set(bookings.map(b=>b.placeId));
  const allBookedPlaces=new Set(bookedIds);
  const stops=[...new Set(day.routeIds.flatMap(id=>routesById.get(id).segments.flatMap(s=>s.placeIds)))].filter(id=>!allBookedPlaces.has(id)&&!guide.persistentPlaceIds.includes(id));
  const title=dateFormatter.format(new Date(day.date+'T12:00:00Z'));
  const flightsAfterProgram=day.id===guide.days[guide.days.length-1].id;
  return '<details class="list-card day-section schedule-card" data-day="'+esc(day.id)+'"><summary class="schedule-heading"><h2><span class="schedule-title">'+esc(title[0].toUpperCase()+title.slice(1))+'</span><svg class="schedule-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></h2>'+(day.summary?'<p class="schedule-teaser">'+esc(day.summary)+'</p>':'')+'</summary><div class="schedule-body">'+(flightsAfterProgram?'':renderFlightCards(day))+(day.id===guide.days[0].id?stayCards:'')+(bookings.length?'<h3>Bokningar</h3>'+bookings.map(b=>{const place=requirePlace(b.placeId);return '<article class="list-card" data-booking="'+esc(b.id)+'" data-category="'+esc(place.category)+'"><span class="list-badge">Bokat</span><h4>'+placeIcon(place)+esc(timeFormatter.format(new Date(b.startsAt)))+' · '+esc(place.name)+'</h4>'+placeDescription(place)+(place.address?'<p class="address">'+esc(place.address)+'</p>':'')+listActions(place)+'</article>'}).join(''):'')+'<h3>Planerat program</h3><article class="list-card list-program">'+renderProgram(day.program)+'</article>'+(stops.length?'<h3>Valbara stopp längs rutten</h3><div class="optional-stops">'+stops.map(id=>'<button class="list-action" data-show-place="'+esc(id)+'">'+esc(requirePlace(id).name)+'</button>').join('')+'</div>':'')+(flightsAfterProgram?renderFlightCards(day):'')+'</div></details>';
 }).join('');
 document.getElementById('schemaPanel').innerHTML='<h1>Dagar</h1><p class="list-intro">Flyg, bokningar, dagens plan och valbara stopp. '+esc(guide.destination.name)+'.</p>'+sections;
}
const filterBox=document.getElementById('placeFilters');
const expandedPlaces=new Set();
let placesMode='overview',renderedPlacesMode='overview',placesGrouping='overview';
try{const saved=localStorage.getItem(guide.id+':places-view');if(['overview','area','reading'].includes(saved))placesMode=saved;if(localStorage.getItem(guide.id+':places-grouping')==='area')placesGrouping='area';if(placesMode!=='reading')placesGrouping=placesMode;}catch{}
const listCategorySelection=new Set(categories.map(c=>c.id));
filterBox.innerHTML=categories.map(c=>'<button aria-pressed="true" data-category="'+esc(c.id)+'">'+categoryIcon(c.id)+esc(c.label)+'</button>').join('');
function placeVisible(place){return place.category!=='hotel'&&listCategorySelection.has(place.category)&&(!bookedIds.includes(place.id)||listCategorySelection.has('booked'))}
function renderPlaceList(){
 if(renderedPlacesMode!=='reading')document.querySelectorAll('[data-place-card]').forEach(card=>{if(card.open)expandedPlaces.add(card.dataset.placeCard);else expandedPlaces.delete(card.dataset.placeCard);});
 renderedPlacesMode=placesMode;document.getElementById('placesPanel').dataset.placesMode=placesMode;
 document.querySelectorAll('.places-view-mode [data-places-mode]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.placesMode===placesMode)));
 filterBox.querySelectorAll('[data-category]').forEach(button=>button.setAttribute('aria-pressed',String(listCategorySelection.has(button.dataset.category))));
 const eligible=content.places.filter(p=>p.category!=='hotel'),visible=eligible.filter(placeVisible),visibleIds=new Set(visible.map(p=>p.id));
 document.getElementById('placeCount').textContent=visible.length+' av '+eligible.length+' platser';
 const cardMarkup=place=>{
  const presentation=markerPresentation[place.id]||{};
  const description=(presentation.descriptionSeparator?place.description.split(presentation.descriptionSeparator)[0]:place.description).split('\n').filter(line=>!line.startsWith('Markören')).join('\n');
  const categoryKey=place.category;
  const focus=place.focus||categories.find(c=>c.id===place.category)?.label||'Upptäck platsen';
  return '<details class="list-card discovery-card" data-place-card="'+esc(place.id)+'" data-category="'+esc(categoryKey)+'"'+(placesMode==='reading'||expandedPlaces.has(place.id)?' open':'')+'><summary class="discovery-heading"'+(placesMode==='reading'?' aria-disabled="true" tabindex="-1"':'')+'>'+placeIcon(place)+'<h3><span class="discovery-title">'+esc(place.name)+'</span></h3><svg class="discovery-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg><p class="discovery-teaser">'+esc(focus)+'</p></summary><div class="discovery-body">'+(bookedIds.includes(place.id)?'<span class="place-booked-status" data-category="booked">'+categoryIcon('booked')+'Bokat</span>':'')+'<p>'+esc(description).replace(/\n/g,'<br>')+'</p>'+placeFacts(place)+(place.address?'<p class="address">'+esc(place.address)+'</p>':'')+(place.verification.status==='unresolved'?'<span class="list-badge uncertain">Uppgifter behöver bekräftas</span>':'')+storyMarkup(place.id,true)+listActions(place)+'</div></details>';
 };
 const sortPlaces=(a,b)=>presentationRegistry.compare(a,b,placeCategories);
 const sortIds=ids=>ids.map(requirePlace).sort(sortPlaces).map(p=>p.id);
 const ordered=(guide.discoveryAreas||[{placeIds:eligible.map(p=>p.id)}]).flatMap(area=>area.placeIds).filter(id=>visibleIds.has(id));
 const byArea=placesMode==='area'||placesMode==='reading'&&placesGrouping==='area';
 const sectionMarkup=byArea?(guide.discoveryAreas||[{id:'all',title:'Upptäck platserna',intro:'',placeIds:ordered}]).map(area=>{
  const ids=sortIds(area.placeIds.filter(id=>visibleIds.has(id)));if(!ids.length)return '';
  return '<section class="discovery-area" data-discovery-area="'+esc(area.id)+'"><h2><span>'+esc(area.title)+'</span><span class="category-count">'+ids.length+'</span></h2>'+(area.intro?'<p class="discovery-intro">'+esc(area.intro)+'</p>':'')+ids.map(id=>cardMarkup(requirePlace(id))).join('')+'</section>';
 }).join(''):placeCategories.map(category=>{
  const ids=ordered.filter(id=>requirePlace(id).category===category.id);if(!ids.length)return '';
  return '<section class="discovery-area" data-discovery-category="'+esc(category.id)+'" data-category="'+esc(category.id)+'"><h2>'+categoryIcon(category.id)+'<span>'+esc(category.label)+'</span><span class="category-count">'+ids.length+'</span></h2>'+sortIds(ids).map(id=>cardMarkup(requirePlace(id))).join('')+'</section>';
 }).join('');
 document.getElementById('placeList').innerHTML=visible.length?sectionMarkup:'<p class="list-empty">Inga platser i de valda kategorierna.</p>';

}
document.getElementById('placeList').addEventListener('toggle',event=>{const card=event.target;if(placesMode==='reading'||!card.isConnected||!card.matches('[data-place-card]'))return;if(card.open)expandedPlaces.add(card.dataset.placeCard);else expandedPlaces.delete(card.dataset.placeCard);},true);
document.getElementById('placeList').addEventListener('click',event=>{if(placesMode==='reading'&&event.target.closest('.discovery-heading'))event.preventDefault();});
document.querySelector('.places-view-mode').addEventListener('click',event=>{const button=event.target.closest('[data-places-mode]');if(!button||placesMode===button.dataset.placesMode)return;placesMode=button.dataset.placesMode;if(placesMode!=='reading')placesGrouping=placesMode;try{localStorage.setItem(guide.id+':places-view',placesMode);localStorage.setItem(guide.id+':places-grouping',placesGrouping);}catch{}renderPlaceList();});
filterBox.addEventListener('click',event=>{const button=event.target.closest('[data-category]');if(!button)return;const id=button.dataset.category;if(listCategorySelection.has(id))listCategorySelection.delete(id);else listCategorySelection.add(id);renderPlaceList()});

listView.addEventListener('click',event=>{const ask=event.target.closest('[data-ask-place]');if(ask){askAboutPlace(requirePlace(ask.dataset.askPlace));return;}const button=event.target.closest('[data-show-place],[data-place]');if(button)showPlaceOnMap(button.dataset.showPlace||button.dataset.place)});
document.getElementById('viewTabs').addEventListener('click',event=>{const button=event.target.closest('[data-view]');if(button)setView(button.dataset.view)});
document.getElementById('viewTabs').addEventListener('keydown',event=>{const tabs=[...document.querySelectorAll('#viewTabs [data-view]')];const index=tabs.indexOf(document.activeElement);if(index<0||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;setView(tabs[next].dataset.view);tabs[next].focus()});
function renderHistory(){
 const sourcesMarkup=sources=>'<details class="story-sources"><summary>Läs vidare</summary>'+sources.map(s=>'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.label)+' ↗</a>').join('')+'</details>';
 const imageMarkup=image=>'<figure class="history-image"><img src="'+esc(image.src)+'" width="'+image.width+'" height="'+image.height+'" alt="'+esc(image.alt)+'" loading="lazy" decoding="async"><figcaption>'+esc(image.caption)+'<span class="history-image-credit">'+esc(image.credit)+' · <a href="'+esc(image.sourceUrl)+'" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a> · <a href="'+esc(image.licenseUrl)+'" target="_blank" rel="noopener noreferrer">'+esc(image.licenseName)+'</a></span></figcaption></figure>';
 const pin='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>';
 document.getElementById('historyPanel').innerHTML='<h1>'+esc(historyContent.title)+'</h1><p class="list-intro">'+esc(historyContent.intro)+'</p>'+historyContent.chapters.map((chapter,index)=>'<details class="list-card history-card history-reading" data-history-chapter="'+esc(chapter.id)+'"><summary class="history-heading"><span class="history-period">'+esc(chapter.period)+'</span><h2><span class="history-number" aria-hidden="true">'+(index+1)+'</span><span class="history-title">'+esc(chapter.title)+'</span><svg class="history-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></h2><p class="history-teaser">'+esc(chapter.teaser)+'</p></summary><div class="history-body"><div class="history-copy">'+chapter.paragraphs.map((p,i)=>'<p>'+esc(p)+'</p>'+(chapter.images||[]).filter(image=>image.afterParagraph===i+1).map(imageMarkup).join('')).join('')+'</div><div class="history-map-links" aria-label="Platser i kapitlet">'+chapter.placeIds.map(id=>{const place=requirePlace(id);return '<div class="history-place-link" data-category="'+esc(place.category)+'">'+sheetActions(place,true,['show'])+placeIcon(place)+'<span class="history-place-name">'+esc(place.name)+'</span>'+'</div>'}).join('')+'</div>'+sourcesMarkup(chapter.sources)+'</div></details>').join('');
}
renderScheduleList();renderHistory();setView(location.hash.slice(1));
window.addEventListener('hashchange',()=>setView(location.hash.slice(1)));

 return {map:m,content,guide,routeContent,storyContent,historyContent,taxonomy,presentationRegistry,listCategorySelection,placesById,markersById,dayRoutes,chooseDay,setDayGuide,setView,showPlaceOnMap,openPlaceSheet,closePlaceSheet};
})();
guideReady.catch(error=>{
 console.error(error);
 const card=document.getElementById('daycard');
 card.textContent='Guiden kunde inte laddas. Tryck på uppdatera eller ladda om sidan.';
 card.style.display='block';
});
</script></html>
